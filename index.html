<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conect PDV</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f3f4f6;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            color: #22c55e;
        }

        .container {
            padding: 25px;
            max-width: 1400px;
            margin: auto;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .card h3 {
            color: #6b7280;
            font-size: 15px;
            margin-bottom: 10px;
        }

        .card strong {
            font-size: 27px;
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .menu button {
            border: none;
            background: white;
            padding: 30px 15px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: 0.2s;
        }

        .menu button:hover {
            transform: translateY(-3px);
            background: #22c55e;
            color: white;
        }

        .icone {
            display: block;
            font-size: 35px;
            margin-bottom: 10px;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #777;
        }

        @media (max-width: 900px) {
            .cards,
            .menu {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .cards,
            .menu {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">Conect <span>PDV</span></div>
    <div>Conect Cell</div>
</header>

<div class="container">

    <div class="cards">

        <div class="card">
            <h3>Vendas hoje</h3>
            <strong>R$ 0,00</strong>
        </div>

        <div class="card">
            <h3>Vendas realizadas</h3>
            <strong>0</strong>
        </div>

        <div class="card">
            <h3>Produtos</h3>
            <strong>0</strong>
        </div>

        <div class="card">
            <h3>Estoque baixo</h3>
            <strong>0</strong>
        </div>

    </div>

    <div class="menu">

        <button onclick="abrirPDV()">
            <span class="icone">🛒</span>
            Frente de Caixa
        </button>

        <button onclick="alert('Cadastro de produtos será desenvolvido nesta etapa.')">
            <span class="icone">📦</span>
            Produtos
        </button>

        <button onclick="alert('Controle de estoque será desenvolvido nesta etapa.')">
            <span class="icone">🏪</span>
            Estoque
        </button>

        <button onclick="alert('Cadastro de clientes será desenvolvido nesta etapa.')">
            <span class="icone">👥</span>
            Clientes
        </button>

        <button onclick="alert('Relatórios serão desenvolvidos nesta etapa.')">
            <span class="icone">📊</span>
            Relatórios
        </button>

        <button onclick="alert('Configurações serão desenvolvidas nesta etapa.')">
            <span class="icone">⚙️</span>
            Configurações
        </button>

        <button onclick="alert('Usuários serão desenvolvidos nesta etapa.')">
            <span class="icone">🔐</span>
            Usuários
        </button>

        <button onclick="alert('Sistema Conect PDV')">
            <span class="icone">💻</span>
            Sobre o sistema
        </button>

    </div>

</div>

<footer>
    Conect PDV © 2026 - Conect Cell
</footer>

<script>
    function abrirPDV() {
        alert("Frente de Caixa - vamos desenvolver esta tela agora!");
    }
</script>

</body>
</html>
