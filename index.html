<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conect PDV</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f3f4f6;
    color:#111827;
}

header{
    background:#111827;
    color:white;
    padding:18px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:28px;
    font-weight:bold;
}

.logo span{
    color:#22c55e;
}

.container{
    max-width:1400px;
    margin:auto;
    padding:30px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    margin-bottom:30px;
}

.card{
    background:white;
    padding:22px;
    border-radius:14px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.card h3{
    color:#6b7280;
    font-size:15px;
    margin-bottom:10px;
}

.card strong{
    font-size:28px;
}

.menu{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.menu button{
    border:0;
    background:white;
    padding:30px 15px;
    border-radius:14px;
    cursor:pointer;
    font-size:18px;
    font-weight:bold;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
    transition:.2s;
}

.menu button:hover{
    transform:translateY(-3px);
    background:#22c55e;
    color:white;
}

.icone{
    display:block;
    font-size:38px;
    margin-bottom:12px;
}

footer{
    text-align:center;
    padding:30px;
    color:#6b7280;
}

/* PDV */

#pdv{
    display:none;
}

.pdv-topo{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.pdv-topo h1{
    font-size:28px;
}

.btn-voltar{
    border:0;
    background:#374151;
    color:white;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.pdv-grid{
    display:grid;
    grid-template-columns:1fr 420px;
    gap:20px;
}

.produtos-area,
.carrinho-area{
    background:white;
    padding:22px;
    border-radius:14px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.produtos-area h2,
.carrinho-area h2{
    margin-bottom:18px;
}

.busca{
    width:100%;
    padding:14px;
    border:1px solid #d1d5db;
    border-radius:8px;
    font-size:16px;
    margin-bottom:20px;
}

.produtos{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.produto{
    border:1px solid #e5e7eb;
    border-radius:10px;
    padding:15px;
    cursor:pointer;
    transition:.2s;
}

.produto:hover{
    border-color:#22c55e;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.produto h3{
    margin-bottom:8px;
}

.preco{
    color:#16a34a;
    font-weight:bold;
    font-size:18px;
}

.carrinho{
    min-height:250px;
}

.item{
    border-bottom:1px solid #e5e7eb;
    padding:12px 0;
}

.item-topo{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.item-controle{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:8px;
}

.item-controle button{
    width:30px;
    height:30px;
    border:0;
    border-radius:6px;
    cursor:pointer;
    background:#e5e7eb;
    font-weight:bold;
}

.remover{
    background:#fee2e2!important;
    color:#dc2626;
}

.total{
    border-top:2px solid #111827;
    margin-top:20px;
    padding-top:18px;
    display:flex;
    justify-content:space-between;
    font-size:24px;
    font-weight:bold;
}

.pagamento{
    margin-top:20px;
}

.pagamento label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
}

.pagamento select{
    width:100%;
    padding:13px;
    border:1px solid #d1d5db;
    border-radius:8px;
    font-size:16px;
}

.finalizar{
    width:100%;
    margin-top:20px;
    padding:16px;
    border:0;
    border-radius:8px;
    background:#16a34a;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.finalizar:hover{
    background:#15803d;
}

.vazio{
    text-align:center;
    color:#6b7280;
    padding:50px 10px;
}

@media(max-width:900px){
    .cards,
    .menu{
        grid-template-columns:repeat(2,1fr);
    }

    .pdv-grid{
        grid-template-columns:1fr;
    }
}

@media(max-width:600px){
    .cards,
    .menu,
    .produtos{
        grid-template-columns:1fr;
    }

    .container{
        padding:15px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">Conect <span>PDV</span></div>
    <div>Conect Cell</div>
</header>

<!-- PAINEL PRINCIPAL -->

<div id="painel" class="container">

    <div class="cards">

        <div class="card">
            <h3>Vendas hoje</h3>
            <strong id="vendasHoje">R$ 0,00</strong>
        </div>

        <div class="card">
            <h3>Vendas realizadas</h3>
            <strong id="quantidadeVendas">0</strong>
        </div>

        <div class="card">
            <h3>Produtos</h3>
            <strong>0</strong>
        </div>

        <div class="card">
            <h3>Estoque baixo</h3>
            <strong>0</strong>
        </div>

    </div>

    <div class="menu">

        <button onclick="abrirPDV()">
            <span class="icone">🛒</span>
            Frente de Caixa
        </button>

        <button onclick="alert('Cadastro de produtos será desenvolvido na próxima etapa.')">
            <span class="icone">📦</span>
            Produtos
        </button>

        <button onclick="alert('Controle de estoque será desenvolvido na próxima etapa.')">
            <span class="icone">🏪</span>
            Estoque
        </button>

        <button onclick="alert('Cadastro de clientes será desenvolvido na próxima etapa.')">
            <span class="icone">👥</span>
            Clientes
        </button>

        <button onclick="alert('Relatórios serão desenvolvidos na próxima etapa.')">
            <span class="icone">📊</span>
            Relatórios
        </button>

        <button onclick="alert('Configurações serão desenvolvidas na próxima etapa.')">
            <span class="icone">⚙️</span>
            Configurações
        </button>

        <button onclick="alert('Controle de usuários será desenvolvido na próxima etapa.')">
            <span class="icone">🔐</span>
            Usuários
        </button>

        <button onclick="alert('Conect PDV - Sistema de vendas da Conect Cell')">
            <span class="icone">💻</span>
            Sobre o sistema
        </button>

    </div>

</div>

<!-- FRENTE DE CAIXA -->

<div id="pdv" class="container">

    <div class="pdv-topo">
        <h1>🛒 Frente de Caixa</h1>

        <button class="btn-voltar" onclick="voltarPainel()">
            ← Voltar
        </button>
    </div>

    <div class="pdv-grid">

        <div class="produtos-area">

            <h2>Produtos</h2>

            <input
                type="text"
                id="busca"
                class="busca"
                placeholder="Digite o nome do produto..."
                oninput="filtrarProdutos()"
            >

            <div id="listaProdutos" class="produtos"></div>

        </div>

        <div class="carrinho-area">

            <h2>🛒 Carrinho</h2>

            <div id="carrinho" class="carrinho">
                <div class="vazio">
                    Nenhum produto adicionado.
                </div>
            </div>

            <div class="total">
                <span>Total</span>
                <span id="total">R$ 0,00</span>
            </div>

            <div class="pagamento">

                <label for="formaPagamento">
                    Forma de pagamento
                </label>

                <select id="formaPagamento">

                    <option value="Pix">
                        Pix
                    </option>

                    <option value="Dinheiro">
                        Dinheiro
                    </option>

                    <option value="Cartão de débito">
                        Cartão de débito
                    </option>

                    <option value="Cartão de crédito">
                        Cartão de crédito
                    </option>

                </select>

            </div>

            <button class="finalizar" onclick="finalizarVenda()">
                ✅ Finalizar venda
            </button>

        </div>

    </div>

</div>

<footer>
    Conect PDV © 2026 - Conect Cell
</footer>

<script>

const produtos = [
    {
        id:1,
        nome:"Carregador 33W",
        preco:80
    },
    {
        id:2,
        nome:"Carregador 40W",
        preco:70
    },
    {
        id:3,
        nome:"Cabo 2m",
        preco:40
    },
    {
        id:4,
        nome:"Mouse",
        preco:25
    },
    {
        id:5,
        nome:"Power Bank",
        preco:110
    }
];

let carrinho = [];

let totalVendas = 0;
let quantidadeVendas = 0;

function dinheiro(valor){

    return valor.toLocaleString("pt-BR",{
        style:"currency",
        currency:"BRL"
    });

}

function abrirPDV(){

    document.getElementById("painel").style.display="none";

    document.getElementById("pdv").style.display="block";

    carregarProdutos();

}

function voltarPainel(){

    document.getElementById("pdv").style.display="none";

    document.getElementById("painel").style.display="block";

}

function carregarProdutos(){

    const lista = document.getElementById("listaProdutos");

    lista.innerHTML="";

    produtos.forEach(produto => {

        const div = document.createElement("div");

        div.className="produto";

        div.innerHTML=`
            <h3>${produto.nome}</h3>
            <div class="preco">${dinheiro(produto.preco)}</div>
        `;

        div.onclick=()=>{
            adicionarCarrinho(produto.id);
        };

        lista.appendChild(div);

    });

}

function filtrarProdutos(){

    const busca = document
        .getElementById("busca")
        .value
        .toLowerCase();

    const lista = document.getElementById("listaProdutos");

    lista.innerHTML="";

    produtos
    .filter(produto =>
        produto.nome.toLowerCase().includes(busca)
    )
    .forEach(produto => {

        const div = document.createElement("div");

        div.className="produto";

        div.innerHTML=`
            <h3>${produto.nome}</h3>
            <div class="preco">${dinheiro(produto.preco)}</div>
        `;

        div.onclick=()=>{
            adicionarCarrinho(produto.id);
        };

        lista.appendChild(div);

    });

}

function adicionarCarrinho(id){

    const produto = produtos.find(p => p.id === id);

    const existente = carrinho.find(p => p.id === id);

    if(existente){

        existente.quantidade++;

    }else{

        carrinho.push({
            id:produto.id,
            nome:produto.nome,
            preco:produto.preco,
            quantidade:1
        });

    }

    atualizarCarrinho();

}

function alterarQuantidade(id, quantidade){

    const item = carrinho.find(p => p.id === id);

    if(!item) return;

    item.quantidade += quantidade;

    if(item.quantidade <= 0){

        carrinho = carrinho.filter(p => p.id !== id);

    }

    atualizarCarrinho();

}

function removerProduto(id){

    carrinho = carrinho.filter(p => p.id !== id);

    atualizarCarrinho();

}

function atualizarCarrinho(){

    const area = document.getElementById("carrinho");

    area.innerHTML="";

    if(carrinho.length === 0){

        area.innerHTML=`
            <div class="vazio">
                Nenhum produto adicionado.
            </div>
        `;

        document.getElementById("total").textContent =
            dinheiro(0);

        return;

    }

    let valorTotal=0;

    carrinho.forEach(item => {

        const subtotal =
            item.preco * item.quantidade;

        valorTotal += subtotal;

        const div = document.createElement("div");

        div.className="item";

        div.innerHTML=`

            <div class="item-topo">

                <strong>${item.nome}</strong>

                <strong>
                    ${dinheiro(subtotal)}
                </strong>

            </div>

            <div class="item-controle">

                <button onclick="alterarQuantidade(${item.id},-1)">
                    -
                </button>

                <span>
                    ${item.quantidade}
                </span>

                <button onclick="alterarQuantidade(${item.id},1)">
                    +
                </button>

                <button
                    class="remover"
                    onclick="removerProduto(${item.id})">
                    🗑
                </button>

            </div>

        `;

        area.appendChild(div);

    });

    document.getElementById("total").textContent =
        dinheiro(valorTotal);

}

function finalizarVenda(){

    if(carrinho.length === 0){

        alert("Adicione pelo menos um produto ao carrinho.");

        return;

    }

    const total = carrinho.reduce(
        (soma,item) =>
        soma + (item.preco * item.quantidade),
        0
    );

    const pagamento =
        document.getElementById("formaPagamento").value;

    const confirmar = confirm(
        "Finalizar venda de " +
        dinheiro(total) +
        " via " +
        pagamento +
        "?"
    );

    if(!confirmar) return;

    totalVendas += total;

    quantidadeVendas++;

    document.getElementById("vendasHoje").textContent =
        dinheiro(totalVendas);

    document.getElementById("quantidadeVendas").textContent =
        quantidadeVendas;

    alert(
        "Venda finalizada com sucesso!\n\n" +
        "Total: " + dinheiro(total) +
        "\nPagamento: " + pagamento
    );

    carrinho=[];

    atualizarCarrinho();

}

</script>

</body>
</html>
